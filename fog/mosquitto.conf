# mosquitto.conf - broker MQTT LOCAL del proyecto (reemplaza a test.mosquitto.org)
#
# Uso:   mosquitto -c fog_config/mosquitto.conf -v
#
# Mosquitto 2.x solo acepta conexiones locales si no hay configuración.
# Con este archivo escucha en el puerto 1883 y acepta clientes sin usuario,
# suficiente para una red local de pruebas (Edge y Fog en la misma red).
# Para un despliegue real agrega usuario/contraseña (password_file).

listener 1883
allow_anonymous true
